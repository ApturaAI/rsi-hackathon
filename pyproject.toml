[project]
name = "skilltrainbench"
version = "0.1.0"
description = "Skill-writing hackathon harness: evaluate a skill package against a frozen learner with the exact scored setup."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.2.3",
    "harbor>=0.22.0",
    "huggingface_hub>=0.24",
]

[project.scripts]
stbench = "skilltrainbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skilltrainbench"]
